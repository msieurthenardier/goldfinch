  fixture that documents how tabBoundary treats an iframe as ONE opaque
  tabbable in the top document. No scripts.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>keyboard-nav: iframe</title>
  </head>
  <body>
    <h1>keyboard-nav fixture — iframe</h1>
    <input id="top" type="text" aria-label="top field" />
    <iframe id="fr" src="iframe-inner.html" title="inner frame"></iframe>
  </body>
</html>

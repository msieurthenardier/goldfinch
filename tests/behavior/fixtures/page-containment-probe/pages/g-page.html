<!doctype html>
<meta charset="utf-8" />
<title>g-pending</title>
<head>
  <script src="/q2-wrappers.js"></script>
  <script src="/g-argscan.js"></script>
</head>
<body style="margin: 0; height: 2000px">
  <button id="plain" style="position: absolute; left: 20px; top: 20px; width: 120px; height: 40px">plain</button>
  <button id="icon" style="position: absolute; left: 300px; top: 100px; width: 40px; height: 20px">i</button>
  <input id="f" style="position: absolute; left: 300px; top: 200px; width: 200px" />
  <script>
    // Page-world handlers record by index assignment only (no wrapped built-in is called).
    window.__pg = [];
    ['mousedown', 'mouseup', 'click', 'contextmenu', 'keydown', 'input', 'beforeinput'].forEach(function (t) {
      ['plain', 'icon', 'f'].forEach(function (id) {
        document.getElementById(id).addEventListener(t, function (e) {
          window.__pg[window.__pg.length] = id + ':' + e.type + ':trusted=' + e.isTrusted + (e.data !== undefined && e.data !== null ? ':data=' + e.data : '');
        });
      });
    });
  </script>
</body>

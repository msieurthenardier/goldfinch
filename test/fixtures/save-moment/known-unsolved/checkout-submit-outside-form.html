<div class="checkout">
  <div class="card-fields">
    <label for="cc-number">Card number</label>
    <input type="text" id="cc-number" name="cardnumber" autocomplete="cc-number" value="4111111111111111" />

    <input type="text" id="cc-name" name="ccname" autocomplete="cc-name" value="Ada Lovelace" />
    <label for="cc-exp">Expiry (MM/YY)</label>
    <input type="text" id="cc-exp" name="cc-exp" autocomplete="cc-exp" maxlength="5" value="04/29" />
    <label for="cc-csc">Security code</label>
    <input type="text" id="cc-csc" name="cvc" autocomplete="cc-csc" value="123" />
  </div>
</div>
<div class="checkout-footer">
  <button type="button" id="place-order">Place order</button>
</div>

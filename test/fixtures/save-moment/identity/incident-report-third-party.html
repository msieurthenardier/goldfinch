<!--
  Fixture: incident-report-third-party
  Corpus tier: gated (identity family) — asserted by assertDetectsEntry.
  ACCEPTED, NAMED FALSE POSITIVE (flight.md DD1/LD4 decision 3, made at Leg 2
  design review round 2; see this leg's own spec, "LD4 — Three round-2
  decisions"). Models an incident-report form: incidentAddress1/
  incidentCity/incidentZip describe WHERE the incident happened — a THIRD
  PARTY's location, not the operator's own address — while reporterName/
  reporterEmail are the reporting operator's own contact details.

  Every gate this detector has clears: incidentAddress1 anchors the scope
  (street's {address1} alternative); reporterName/reporterEmail supply the
  required non-postal role (LD4 amendment 2). DD1's own founding principle
  ("nothing is inferred from shape, position or value") structurally forbids
  the only signal that could tell these two field groups apart — label
  proximity / semantic grouping — so this shape is IRREDUCIBLE to a
  vocabulary-only detector. It is accepted rather than pretended away. The
  backstop is DD2's conflict rule (Leg 3): a captured value that differs from
  an already-stored profile never silently overwrites; it surfaces an
  explicit update naming exactly what changed, so a stranger's incident
  address can never silently corrupt the operator's own saved identity.

  This fixture stays in the corpus, pinned admitted-with-reasoning, and must
  NOT be "fixed" by narrowing the vocabulary — the leg's own design review
  concluded there is no vocabulary-only fix available.
  Added: 2026-09-20 (Mission 21, Flight 2, Leg 2 — identity-boundary).
-->
<form id="incident-report">
  <label for="ir-name">Your name</label>
  <input type="text" id="ir-name" name="reporterName" />
  <label for="ir-email">Your email</label>
  <input type="email" id="ir-email" name="reporterEmail" />
  <label for="ir-addr1">Where did this happen? Address</label>
  <input type="text" id="ir-addr1" name="incidentAddress1" />
  <label for="ir-city">City</label>
  <input type="text" id="ir-city" name="incidentCity" />
  <label for="ir-zip">Postal / ZIP code</label>
  <input type="text" id="ir-zip" name="incidentZip" />
  <button type="submit">Submit report</button>
</form>

<!--
  Fixture: billing-jostens
  Corpus tier: gated (identity family) — asserted by assertDetectsEntry.
  Models the motivating real-world shape from mission planning (a Jostens-
  style checkout billing step): every field carries autocomplete="on" — a
  near-useless generic hint (resolveAutocompleteToken finds no role for the
  bare token "on") that real checkouts ship all the time — so DETECTION MUST
  work off name/id alone, exactly the fallback vocabulary this leg exists to
  prove (LD1's alternatives model). The scope anchors on billingAddress1
  (street, via the {address1} alternative) and billingPostalCode (postalCode,

<form id="billing-address">
  <label for="bf-first">First name</label>
  <input type="text" id="bf-first" name="billingFirstName" autocomplete="on" />
  <label for="bf-last">Last name</label>
  <input type="text" id="bf-last" name="billingLastName" autocomplete="on" />
  <label for="bf-email">Email</label>
  <input type="email" id="bf-email" name="billingEmail" autocomplete="on" />
  <label for="bf-phone">Phone</label>
  <input type="tel" id="bf-phone" name="billingPhone" autocomplete="on" />
  <label for="bf-addr1">Address line 1</label>
  <input type="text" id="bf-addr1" name="billingAddress1" autocomplete="on" />
  <label for="bf-city">City</label>
  <input type="text" id="bf-city" name="billingCity" autocomplete="on" />
  <label for="bf-zip">Postal code</label>
  <input type="text" id="bf-zip" name="billingPostalCode" autocomplete="on" />
  <label for="bf-country">Country</label>
  <input type="text" id="bf-country" name="billingCountry" autocomplete="on" />
  <button type="submit">Continue</button>
</form>

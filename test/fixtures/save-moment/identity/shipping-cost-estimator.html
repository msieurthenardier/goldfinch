  Corpus tier: negative-detection (identity family) — asserted by
  assertNoDetectableEntry once it is extended to the identity family.
  Models a shipping-cost calculator widget (zip + country, nothing else) —
  the exact adversarial shape flight DD1's second round-2 amendment (LD4)

<form id="estimator">
  <label for="sc-zip">ZIP code</label>
  <input type="text" id="sc-zip" name="zip" />
  <label for="sc-country">Country</label>
  <input type="text" id="sc-country" name="country" />
  <button type="submit">Estimate shipping</button>
</form>

<!--
  Fixture: decoy-cancel-beside-password
  Corpus tier: negative-gesture (DEFERRED — committed and documented now,
  asserted by assertNoOffer only once Leg 5 (broadened-capture) exists; see
  flight.md DD3 and the Leg 4 design-review entry in flight-log.md).
  Models: a login dialog with a prominent "Cancel" button placed right beside
  a real password field — e.g. a modal login prompt, where clicking Cancel
  must never be mistaken for a save-worthy submission. A genuine near-miss,
  not a strawman: a naive "any trusted click near a password field" heuristic
  WOULD fire on the Cancel click. findAllLoginFields legitimately detects the
  real password field regardless of which button is clicked — detection
  cannot be what distinguishes this case.
  Why negative-gesture, not negative-detection: asserting "no offer" today via
  a detection-based stand-in (assertNoDetectableEntry) would PASS, but for the
  wrong reason — it would pass even if a future trigger naively fired on the
  Cancel click, because detection isn't what's being tested here. The whole
  point of this fixture is WHICH control was clicked, which only Leg 5's
  gesture/disposition logic can tell apart from a real submit.
  Added: 2026-09-19 (Mission 21, Flight 1, Leg 4 — fixture-corpus).
-->
<form id="login-modal">
  <label for="user">Username</label>
  <input type="text" id="user" name="username" autocomplete="username" />
  <label for="pw">Password</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" />
  <button type="button" id="cancel">Cancel</button>
  <button type="submit" id="submit">Log in</button>
</form>

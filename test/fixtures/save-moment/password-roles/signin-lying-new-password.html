<!--
  Fixture: signin-lying-new-password
  Corpus tier: gated (positive). Family: login. Leg: password-field-roles.
  DD2's "lying autocomplete" negative for THIS leg: an ordinary sign-in form
  whose single password field is (incorrectly) marked
  `autocomplete="new-password"`. `classifyPasswordScope` honestly reports
  `roles: ['new']` (`kind: 'classified'`, per AC4 — a single field resolved
  `new` IS classified) — but AC7's regression gate means the PLANNER never
  routes a one-field scope through the multi-field classification path at
  all: this must still capture exactly as a sign-in always has (that field's
  own value, NO `currentPassword` key), and because the scope has no `current`
  role anywhere, it can never reach DD4's password-match disposition either.
  Added: 2026-09-22 (Mission 21, Flight 4, Leg 2 — password-field-roles).
-->
<form id="login" action="/login" method="post">
  <label for="lie-username">Username</label>
  <input type="text" id="lie-username" name="username" autocomplete="username" value="erin" />
  <label for="lie-password">Password</label>
  <input type="password" id="lie-password" name="password" autocomplete="new-password" value="hunter3" />
  <button type="submit">Log in</button>
</form>

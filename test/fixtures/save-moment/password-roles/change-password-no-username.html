<!--
  Fixture: change-password-no-username
  Corpus tier: gated (positive). Family: login. Leg: password-field-roles.
  A change-password form with NO username-shaped field at all — no
  text/email/tel input anywhere preceding the password fields, so
  `resolveLoginEntry`'s own username heuristic finds nothing:
  `usernameDetected: false`, `username: null` (DD4's own motivating scenario
  — "change-password forms often have no username field", which is exactly
  why disposition needs the current-password match rather than the
  origin+username one). Three fields, marked via autocomplete
  (current-password / new-password / new-password), same values as the other
  three-field fixtures.
  Added: 2026-09-22 (Mission 21, Flight 4, Leg 2 — password-field-roles).
-->
<form id="change-password" action="/account/password" method="post">
  <label for="cp-current">Current password</label>
  <input type="password" id="cp-current" name="current_password" autocomplete="current-password" value="OldPass1!" />
  <label for="cp-new">New password</label>
  <input type="password" id="cp-new" name="new_password" autocomplete="new-password" value="NewPass2!" />
  <label for="cp-confirm">Confirm new password</label>
  <input type="password" id="cp-confirm" name="new_password_confirm" autocomplete="new-password" value="NewPass2!" />
  <button type="submit">Change password</button>
</form>

<!--
  Fixture: signin-current-password
  Corpus tier: gated (positive). Family: login. Leg: password-field-roles.
  The ordinary single-field sign-in shape, marked `autocomplete="current-
  password"` — the AC4 canonical `sign-in` case (`classifyPasswordScope`
  yields `{ kind: 'sign-in', roles: ['current'] }`). Proves the regression
  gate (AC7): a one-field scope captures exactly today's payload — no
  `currentPassword` key, whatever the classifier says about the field's own
  role.
  Added: 2026-09-22 (Mission 21, Flight 4, Leg 2 — password-field-roles).
-->
<form id="login" action="/login" method="post">
  <label for="si-username">Username</label>
  <input type="text" id="si-username" name="username" autocomplete="username" value="alice" />
  <label for="si-password">Password</label>
  <input type="password" id="si-password" name="password" autocomplete="current-password" value="hunter2" />
  <button type="submit">Log in</button>
</form>

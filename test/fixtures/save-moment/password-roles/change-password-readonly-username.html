<!--
  Fixture: change-password-readonly-username
  Corpus tier: gated (positive). Family: login. Leg: password-field-roles.
  DD4's downgrade-exemption scenario: a change-password page that shows the
  operator's username as a read-only, server-prefilled field the operator
  never typed into. The manifest entry lists `#cp-username` in `ungranted` so
  the corpus's provenance stand-in ("grant every field with a value") does
  NOT grant this one, honestly modelling "detected but never provenanced" —
  `usernameDetected: true` (the field IS on the page), `username: null` (the
  value never crosses the provenance gate). Three MARKED password fields
  (current/new/new->confirm), matching the other three-field fixtures'
  values, so `currentPassword` rides the plan and DD4's password-match
  disposition — not the username — is what must resolve the rotation.
  Added: 2026-09-22 (Mission 21, Flight 4, Leg 2 — password-field-roles).
-->
<form id="change-password" action="/account/password" method="post">
  <label for="cp-username">Username</label>
  <input type="text" id="cp-username" name="username" autocomplete="username" value="dana" readonly />
  <label for="cp-current">Current password</label>
  <input type="password" id="cp-current" name="current_password" autocomplete="current-password" value="OldPass1!" />
  <label for="cp-new">New password</label>
  <input type="password" id="cp-new" name="new_password" autocomplete="new-password" value="NewPass2!" />
  <label for="cp-confirm">Confirm new password</label>
  <input type="password" id="cp-confirm" name="new_password_confirm" autocomplete="new-password" value="NewPass2!" />
  <button type="submit">Change password</button>
</form>

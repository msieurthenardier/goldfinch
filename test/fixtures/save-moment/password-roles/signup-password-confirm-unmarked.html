<!--
  Fixture: signup-password-confirm-unmarked
  Corpus tier: gated (positive). Family: login. Leg: password-field-roles
  (Mission 21, Flight 4, Leg 2).
  Models the single most common unmarked sign-up shape: a username field plus
  TWO password fields carrying no autocomplete hint and no name/id token any
  layer recognises (`password`/`password2` — plain, no separator, no digit
  hump) — so classification falls all the way to DD1's layer 3 (structure):
  two fields, neither resolved `current` -> new + confirm, in document order.
  Both password values are IDENTICAL (the operator typed the same string
  twice), so DD3's confirm-agreement check admits the plan.
  Added: 2026-09-22 (Mission 21, Flight 4, Leg 2 — password-field-roles).
-->
<form id="signup" action="/signup" method="post">
  <label for="su-username">Username</label>
  <input type="text" id="su-username" name="username" autocomplete="username" value="newuser" />
  <label for="su-password">Password</label>
  <input type="password" id="su-password" name="password" value="NewPass123!" />
  <label for="su-password-confirm">Confirm password</label>
  <input type="password" id="su-password-confirm" name="password2" value="NewPass123!" />
  <button type="submit">Create account</button>
</form>

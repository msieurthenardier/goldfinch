<!--
  Fixture: signup-new-password-marked
  Corpus tier: gated (positive). Family: login. Leg: password-field-roles.
  A sign-up form that follows the WHATWG recommendation of marking BOTH the
  password and confirm-password fields `autocomplete="new-password"` (real
  sites routinely do exactly this — the spec's own guidance is that a site
  need not distinguish them). AC1: the FIRST resolves `new`; the SECOND
  resolves `confirm` (the "a second new-password in the scope becomes
  confirm" rule) — resolved entirely in layer 1, no fallback-token layer
  needed. Values agree, so the plan is admitted.
  Added: 2026-09-22 (Mission 21, Flight 4, Leg 2 — password-field-roles).
-->
<form id="signup" action="/signup" method="post">
  <label for="su-username">Username</label>
  <input type="text" id="su-username" name="username" autocomplete="username" value="newuser2" />
  <label for="su-password">Password</label>
  <input type="password" id="su-password" name="password" autocomplete="new-password" value="Correct-Horse-1!" />
  <label for="su-password-confirm">Confirm password</label>
  <input
    type="password"
    id="su-password-confirm"
    name="password2"
    autocomplete="new-password"
    value="Correct-Horse-1!"
  />
  <button type="submit">Create account</button>
</form>

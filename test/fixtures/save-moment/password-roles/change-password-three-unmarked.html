<!--
  Fixture: change-password-three-unmarked
  Corpus tier: gated (positive). Family: login. Leg: password-field-roles.
  THE MOTIVATING SHAPE (flight.md's own "live defect this fixes" finding): a
  change-password form, three password fields, NONE carrying an autocomplete
  hint or a recognisable name/id token (`password`/`password2`/`password3`),
  so classification falls to DD1's layer 3 (structure): three fields ->
  current, new, confirm, in document order. Before this leg,
  `resolveOrdinalInFamily` resolved the submit gesture to the FIRST in-form
  login entry — the CURRENT password field — so a rotation would have saved
  the OLD password; this fixture is what proves that no longer happens.
  Values: current != new, and confirm == new (the operator typed the new
  password twice) — DD3's confirm-agreement rule admits the plan, and DD4's
  current-password rule carries the current value for the disposition match.
  Added: 2026-09-22 (Mission 21, Flight 4, Leg 2 — password-field-roles).
-->
<form id="change-password" action="/account/password" method="post">
  <label for="cp-username">Username</label>
  <input type="text" id="cp-username" name="username" autocomplete="username" value="alice" readonly />
  <label for="cp-current">Current password</label>
  <input type="password" id="cp-current" name="password" value="OldPass1!" />
  <label for="cp-new">New password</label>
  <input type="password" id="cp-new" name="password2" value="NewPass2!" />
  <label for="cp-confirm">Confirm new password</label>
  <input type="password" id="cp-confirm" name="password3" value="NewPass2!" />
  <button type="submit">Change password</button>
</form>

---
# ESLint + Prettier check over the repo — mirrors the GitHub Actions "Lint" step (ci.yml).
platform: linux

image_resource:
  type: registry-image
  source:
    repository: node
    tag: '22'
  version:
    digest: 'sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb' # node:22 index digest, resolved 2026-11-17 (see ci/README.md)

inputs:
  - name: repo

run:
  path: bash
  args:
    - -ceu
    - |
      cd repo
      npm ci
      npm run lint
      npm run format:check

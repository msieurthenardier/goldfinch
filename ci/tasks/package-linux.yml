---
# Package smoke check (compile + bundle, no installers) — mirrors the GitHub
# Actions "Package (no installers)" step (ci.yml): `electron-builder --linux --dir`.
# This only unpacks the app into dist/ (no AppImage/deb), so a bare node image
# with electron-builder's own download of the Electron binary is sufficient.
platform: linux

image_resource:
  type: registry-image
  source:
    repository: node
    tag: '22'
  version:
    digest: 'sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb' # node:22 index digest, resolved 2026-11-17 (see ci/README.md)

inputs:
  - name: repo

run:
  path: bash
  args:
    - -ceu
    - |
      cd repo
      npm ci
      npx electron-builder --linux --dir
      # Fail the packaging if any runtime fuse (or any other fuse) is not as expected.
      node scripts/check-fuses.mjs dist/linux-unpacked/goldfinch

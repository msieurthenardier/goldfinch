---
# Unit suite — mirrors the GitHub Actions "Unit tests" step (ci.yml).
# Runnable two ways:
#   fly -t local-goldfinch execute -c ci/tasks/test.yml -i repo=.   (local tree)
#   as a task in ci/pipeline.yml                                    (git resource)
platform: linux

image_resource:
  type: registry-image
  source:
    repository: node
    tag: '22'
  version:
    digest: 'sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb' # node:22 index digest, resolved 2026-11-17 (see ci/README.md)

inputs:
  - name: repo

run:
  path: bash
  args:
    - -ceu
    - |
      cd repo
      npm ci
      npm test

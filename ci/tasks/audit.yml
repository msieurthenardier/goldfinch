---
# Dependency audit — mirrors the GitHub Actions "Dependency audit" step (ci.yml).
# Triage policy (unchanged from ci.yml): a high here is actionable ONLY by
# updating the offending dependency — never by lowering --audit-level.
platform: linux

image_resource:
  type: registry-image
  source:
    repository: node
    tag: '22'
  version:
    digest: 'sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb' # node:22 index digest, resolved 2026-11-17 (see ci/README.md)

inputs:
  - name: repo

run:
  path: bash
  args:
    - -ceu
    - |
      cd repo
      npm ci
      npm audit --audit-level=high

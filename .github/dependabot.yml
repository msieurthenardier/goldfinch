# Keeps dependencies current so the project never silently drifts a major
# version behind again (the 01-maintenance mission's recurrence-prevention goal).
#
# Minor/patch bumps are grouped into a single weekly PR to reduce noise.
# MAJOR bumps (notably `electron`/`electron-builder`) arrive as their own PRs:
# before merging an Electron major, run the behavior tests against the upgraded
# app — `/behavior-test core-browsing-shields` (Shields/webRequest regression)
# and `/behavior-test tab-scheme-guard` (F1 hostile-URL guard) — they are the
# manual runtime gate for an upgrade (CI's gates are type/unit/lint/audit only).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # RE-PIN BEFORE MERGING. Dependabot proposes a mutable tag (`@vX.Y.Z`).
  # Resolve that version's commit SHA with `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`
  # (it dereferences an annotated tag to its commit; `git/ref/tags/<tag>` would
  # return the tag object's SHA) and re-pin to `owner/repo@<40-hex> # vX.Y.Z`.
  # CI's SHA-pin invariant (test/unit/release-workflow-invariants.test.js) only
  # catches an unpinned action after the merge. See CLAUDE.md "Release / CI".
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly

name: Build installers

# Build desktop installers for Windows, macOS, and Linux.
# - Push a version tag like v0.1.0 -> build all platforms and publish a GitHub Release.
# - Run manually (workflow_dispatch) -> runs EVERYTHING except the final upload and the
#   release steps: it builds, checks and stages the installers, runs the upload job's name
#   and digest checks, and publishes nothing. The staged installers stay on the run as
#   one-day artifacts.
#
# Who may write (Mission 23 finding 19). The `build` job runs dependency install scripts and
# the project's own build, so it holds `contents: read` only, no token, and checkout does not
# persist credentials. It cannot reach the Release. Its output is the five installers, staged by
# exact name, plus a SHA-256 list and the version, passed through Actions artifact storage
# (retention one day, no compression: the installers are already compressed). The `upload` job
# runs no project code (no checkout, no node/npm): it downloads those artifacts, recomputes every
# digest, asserts the file names are EXACTLY the five expected for the tag's version, and only
# then uploads into the draft Release. The digest comparison proves integrity BETWEEN jobs; it
# does not prove the build job was honest (the build job is the party being contained).
#
# Provenance and where a stable release may come from (Mission 23 finding 7 and 19). After the
# upload, the `upload` job attests exactly the verified installers (tag builds only) with
# actions/attest, so a downloaded installer can be traced to this workflow run and commit. A stable
# tag is refused in `create-release`, before any draft exists, unless its commit is reachable from the
# default branch. Reachable, not "is the head" and not "passed checks".
#
# History: installers used to be published straight from the build job by electron-builder
# (its publish mode) because artifact storage once blocked releases (v0.5.0 / v0.5.1: the free
# 500 MB tier filled while the repository was private). The repository is public now and the
# artifacts are kept one day. If artifact upload fails on a quota, fall back to one job with the
# token given only to the upload step.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Least privilege: read-only by default; only the jobs that touch the Release
# escalate to contents: write per-job below (create-release, upload, publish-release).
# The build job never does.
permissions:
  contents: read

jobs:
  # Create the draft Release once (tags only), with auto-generated notes, so the
  # upload job puts the installers into ONE existing release. Also validates the tag
  # is strict semver and classifies stability. Uses only `gh` with --repo: no checkout.
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_stable: ${{ steps.ver.outputs.is_stable }}
    steps:
      - name: Validate semver tag and classify stability
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$ver" =~ $semver ]]; then
            echo "::error::Tag '$tag' is not strict semver (vMAJOR.MINOR.PATCH[-prerelease][+build]); refusing to publish."
            exit 1
          fi
          core="${ver%%+*}"
          if [[ "$core" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "Validated '$tag' as a PRERELEASE ($ver)."
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "Validated '$tag' as a STABLE release ($ver)."
          fi

      # A stable tag must point at a commit that is already on the default branch (reachable
      # from it), so the update notice's "latest release" cannot name unreviewed history. Prerelease
      # tags skip this; stability comes from the step above (the tag string), never from a name.
      # GitHub's compare endpoint answers `behind` / `identical` for a commit contained in the
      # branch. No checkout needed. One retry for anything but a 403 (a tag pushed seconds ago can
      # briefly read as 404 or `ahead`); every other answer refuses.
      - name: Require a stable tag to be on the default branch
        if: steps.ver.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          stable_tag_on_default() {
            local sha="$1" default="$2" attempt out rc status errf err
            errf="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/compare-err.XXXXXX")"
            for attempt in 1 2; do
              rc=0
              # stdout is the answer; stderr goes to its own file so a notice never changes it.
              out="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${default}...${sha}" --jq .status 2>"$errf")" || rc=$?
              status="$(printf '%s' "$out" | head -c 200 | tr -d '\r\n')"
              err="$(head -c 200 "$errf" | tr -d '\r\n')"
              echo "compare ${default}...${sha}: attempt ${attempt}: rc=${rc} answer='${status}' stderr='${err}'"
              if [ "$rc" -eq 0 ]; then
                case "$status" in
                  identical | behind) rm -f "$errf"; return 0 ;;
                esac
              fi
              # gh prints the HTTP status text on stderr (and, for some errors, in the body on stdout).
              case "$status $err" in *"HTTP 403"*) rm -f "$errf"; return 1 ;; esac
              [ "$attempt" -eq 1 ] && sleep 10
            done
            rm -f "$errf"
            return 1
          }
          echo "Tag ${GITHUB_REF_NAME} commit ${GITHUB_SHA}; default branch '${DEFAULT_BRANCH}'."
          if stable_tag_on_default "$GITHUB_SHA" "$DEFAULT_BRANCH"; then
            echo "Commit ${GITHUB_SHA} is on ${DEFAULT_BRANCH}; allowed."
          else
            echo "::error::Stable tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not on ${DEFAULT_BRANCH}; refusing to create a release. Merge the release-prep change first, then tag the merged commit."
            exit 1
          fi

      - name: Create the draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Pre-create the release as a DRAFT with generated notes so notes survive and
          # the upload job has one release to add to. Idempotent: reuse if present.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists - reusing."
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --draft --generate-notes --title "${GITHUB_REF_NAME}"
          fi

  # Runs project code (npm ci install scripts, the build). READ-ONLY, NO TOKEN: nothing in this
  # job may reference a secret or the GitHub token. It builds with `--publish never`, checks the
  # fuses and (macOS) the signature, starts the unpacked app once, stages the platform's
  # installers by exact name and uploads them as one artifact.
  build:
    name: Build (${{ matrix.platform }})
    needs: create-release
    # Run on a tag (after the draft exists) AND on manual dispatch (create-release is
    # skipped there). `always()` lets this run despite the skipped dependency on dispatch.
    if: always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The npm cache is used on a manual dispatch only, never on a tag build.
          cache: ${{ github.event_name == 'workflow_dispatch' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      # On a v* tag, the tag is the source of truth for the release version:
      # sync package.json so installer names/metadata match the git tag without a manual bump.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # --ignore-scripts: skip the `version` lifecycle hook (it regenerates the README
        # download links during local release-prep - irrelevant to the CI build, which only
        # needs the number synced for installer names).
        run: npm version --no-git-tag-version --allow-same-version --ignore-scripts "${GITHUB_REF_NAME#v}"

      # Never published from here (`--publish never`): the upload job does that.
      - name: Build ${{ matrix.platform }} installers
        shell: bash
        run: npx electron-builder --${PLATFORM} --publish never
        env:
          # No Apple/Windows signing certs in CI -> produce unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The unpacked app's path is named ONCE here and reused by the fuse check, the
      # signature check and the start check.
      - name: Locate the unpacked app
        shell: bash
        run: |
          set -eu
          APP_BUNDLE=''
          case "$PLATFORM" in
            mac)
              APP_BUNDLE="$(find dist -maxdepth 2 -name Goldfinch.app -type d | head -n 1)"
              [ -n "$APP_BUNDLE" ] || { echo "::error::no Goldfinch.app under dist/"; ls -R dist | head -50; exit 1; }
              APP_BIN="$APP_BUNDLE/Contents/MacOS/Goldfinch"
              ;;
            win) APP_BIN='dist/win-unpacked/Goldfinch.exe' ;;
            linux) APP_BIN='dist/linux-unpacked/goldfinch' ;;
            *) echo "::error::unknown platform $PLATFORM"; exit 1 ;;
          esac
          [ -f "$APP_BIN" ] || { echo "::error::unpacked binary not found: $APP_BIN"; exit 1; }
          echo "APP_BIN=$APP_BIN" >> "$GITHUB_ENV"
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
          echo "Unpacked app: $APP_BIN"

      - name: Check Electron fuses
        shell: bash
        run: node scripts/check-fuses.mjs "$APP_BIN"

      # Proves the fuse step's `codesign --sign - --force --deep` left a valid ad-hoc signature
      # on the whole bundle. Never `spctl`: it rejects every ad-hoc app. Blocking on macOS.
      - name: Verify the ad-hoc signature (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -eu
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          sig="$(codesign -dv "$APP_BUNDLE" 2>&1)"
          printf '%s\n' "$sig"
          grep -q 'Signature=adhoc' <<<"$sig" || { echo "::error::bundle is not ad-hoc signed"; exit 1; }

      # Start the unpacked app once, in a fresh profile (--user-data-dir: Chromium resolves it on
      # every platform, unlike HOME / APPDATA / Application Support). It passes only when, within
      # ~30 s, the process is still running AND the profile holds app.db (the app opens it in its
      # ready chain, so the boot got that far) AND the profile holds no crash log.
      - name: Start the unpacked app once
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/start-check.sh" <<'SCRIPT'
          profile="$(mktemp -d)"
          profile_arg="$profile"
          if [ "$PLATFORM" = win ]; then profile_arg="$(cygpath -w "$profile")"; fi
          log="$RUNNER_TEMP/app-start-$PLATFORM.log"
          extra=()
          if [ "${NO_SANDBOX:-}" = 1 ]; then extra+=(--no-sandbox); fi
          "$APP_BIN" "--user-data-dir=$profile_arg" ${extra[@]+"${extra[@]}"} >"$log" 2>&1 &
          pid=$!
          winpid="$pid"
          if [ "$PLATFORM" = win ] && [ -r "/proc/$pid/winpid" ]; then winpid="$(cat "/proc/$pid/winpid")"; fi
          stop_app() {
            if [ "$PLATFORM" = win ]; then
              taskkill //F //T //PID "$winpid" >/dev/null 2>&1 || true
            else
              kill "$pid" 2>/dev/null || true
              sleep 1
              kill -9 "$pid" 2>/dev/null || true
            fi
          }
          have_db=0
          for _ in $(seq 1 30); do
            sleep 1
            kill -0 "$pid" 2>/dev/null || break
            if [ -f "$profile/app.db" ]; then have_db=1; break; fi
          done
          if [ "$have_db" = 1 ]; then sleep 3; fi
          running=0
          if kill -0 "$pid" 2>/dev/null; then running=1; fi
          crash=0
          if [ -e "$profile/crash-log.jsonl" ]; then crash=1; fi
          stop_app
          echo "start check: running=$running app.db=$have_db crash-log=$crash"
          if [ "$running" = 1 ] && [ "$have_db" = 1 ] && [ "$crash" = 0 ]; then exit 0; fi
          echo "---- app output (last 40 lines) ----"
          tail -n 40 "$log" || true
          [ "$crash" = 1 ] && { echo "---- crash log ----"; cat "$profile/crash-log.jsonl" || true; }
          exit 1
          SCRIPT
          if [ "$PLATFORM" = linux ]; then
            command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb
            # The runner restricts unprivileged user namespaces; try to keep the real sandbox.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "sysctl not applied"
            if ! xvfb-run -a bash "$RUNNER_TEMP/start-check.sh"; then
              echo "::warning::start check failed WITH the sandbox; retrying once with --no-sandbox (the runner could not provide the sandbox)"
              NO_SANDBOX=1 xvfb-run -a bash "$RUNNER_TEMP/start-check.sh"
            fi
          else
            bash "$RUNNER_TEMP/start-check.sh"
          fi

      # Stage ONLY this platform's installers, by exact expected name (the builder also writes
      # latest*.yml, *.blockmap, debug files and the unpacked tree - none is copied; a missing
      # expected file fails the job), plus the version and a SHA-256 list of them.
      - name: Stage installers
        shell: bash
        run: |
          set -eu
          expected_names() {
            local v="$1" p="${2:-all}"
            case "$p" in win | all) echo "Goldfinch-Setup-${v}.exe" ;; esac
            case "$p" in mac | all) echo "Goldfinch-${v}-arm64.dmg"; echo "Goldfinch-${v}-arm64-mac.zip" ;; esac
            case "$p" in linux | all) echo "Goldfinch-${v}.AppImage"; echo "goldfinch_${v}_amd64.deb" ;; esac
          }
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "$VERSION" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::package.json version $VERSION does not match tag ${GITHUB_REF_NAME}"; exit 1
          fi
          rm -rf stage
          mkdir stage
          names="$(expected_names "$VERSION" "$PLATFORM")"
          for n in $names; do
            [ -f "dist/$n" ] || { echo "::error::expected installer missing: dist/$n"; ls -la dist; exit 1; }
            cp "dist/$n" stage/
          done
          printf '%s\n' "$VERSION" > stage/VERSION
          cd stage
          # One portable list form on every platform: `<hash>  <name>` (two spaces, no `*`).
          # Git-for-Windows' sha256sum writes binary mode (`<hash> *<name>`); coreutils on Linux
          # and `shasum -a 256` on macOS write the two-space text form. The sed rewrites either
          # marker to two spaces rather than relying on a `--text` flag that not every build has.
          if command -v sha256sum >/dev/null; then sha256sum $names > SHA256SUMS.raw; else shasum -a 256 $names > SHA256SUMS.raw; fi
          sed -E 's/^([0-9a-fA-F]+) [ *]/\1  /' SHA256SUMS.raw > SHA256SUMS
          rm SHA256SUMS.raw
          cat SHA256SUMS
          ls -la

      - name: Upload staged installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: stage/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Runs NO project code: no checkout, no npm/npx/node. It checks what the build jobs staged and
  # uploads it. On a manual dispatch it runs every step except the upload.
  upload:
    name: Upload installers
    needs: [create-release, build]
    if: always() && needs.build.result == 'success' && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download staged installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # Integrity BETWEEN jobs, not proof the build job was honest. Fails before any upload.
      - name: Verify names and digests
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected_names() {
            local v="$1" p="${2:-all}"
            case "$p" in win | all) echo "Goldfinch-Setup-${v}.exe" ;; esac
            case "$p" in mac | all) echo "Goldfinch-${v}-arm64.dmg"; echo "Goldfinch-${v}-arm64-mac.zip" ;; esac
            case "$p" in linux | all) echo "Goldfinch-${v}.AppImage"; echo "goldfinch_${v}_amd64.deb" ;; esac
          }
          # The name is everything after the hash and the first run of spaces, minus ONE leading
          # `*` (the binary-mode marker a Windows sha256sum writes), so a name is never truncated.
          listed_names() {
            sed -E -e 's/^[0-9a-fA-F]+ +//' -e 's/^\*//' "$1" | sort
          }
          fail() { echo "::error::$1"; exit 1; }
          dirs=(artifacts/*/)
          [ "${#dirs[@]}" -eq 3 ] || fail "expected 3 artifacts, found ${#dirs[@]}"
          names="$(for d in "${dirs[@]}"; do d="${d%/}"; printf '%s\n' "${d#artifacts/}"; done | sort)"
          [ "$names" = "$(printf '%s\n' installers-linux installers-mac installers-win)" ] || fail "artifact directory names are not exactly installers-mac, installers-linux, installers-win"
          [ -z "$(find artifacts -mindepth 1 ! -type f ! -type d)" ] || fail "artifact tree holds something other than files and directories"
          [ -z "$(find artifacts -mindepth 2 -type d)" ] || fail "artifact tree is nested"
          [ -z "$(find artifacts -mindepth 1 -maxdepth 1 ! -type d)" ] || fail "stray file beside the artifact directories"
          versions="$(cat artifacts/*/VERSION | sort -u)"
          [ "$(printf '%s\n' "$versions" | wc -l)" -eq 1 ] || fail "the platforms staged different versions"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [ "$versions" = "$v" ] || fail "staged version $versions does not match tag ${GITHUB_REF_NAME}"
          else
            v="$versions"
          fi
          : > "$RUNNER_TEMP/found.txt"
          : > "$RUNNER_TEMP/upload-list.txt"
          for d in "${dirs[@]}"; do
            d="${d%/}"
            ( cd "$d" && sha256sum -c SHA256SUMS )
            files="$(cd "$d" && ls -1 | grep -v -x -e VERSION -e SHA256SUMS | sort)"
            listed="$(listed_names "$d/SHA256SUMS")"
            [ "$files" = "$listed" ] || fail "$d: the digest list does not match the files present"
            while IFS= read -r f; do
              echo "$f" >> "$RUNNER_TEMP/found.txt"
              echo "$d|$f" >> "$RUNNER_TEMP/upload-list.txt"
            done <<<"$files"
          done
          sort "$RUNNER_TEMP/found.txt" > "$RUNNER_TEMP/found.sorted"
          expected_names "$v" | sort > "$RUNNER_TEMP/expected.sorted"
          if ! diff "$RUNNER_TEMP/expected.sorted" "$RUNNER_TEMP/found.sorted"; then
            fail "installer names are not exactly the five expected for $v"
          fi
          echo "Verified five installers for $v:"
          cat "$RUNNER_TEMP/found.sorted"
          # The attest step's subjects: exactly the verified installer paths, one per line (never
          # VERSION or SHA256SUMS, never a glob). Written only after every check above passed.
          {
            echo 'subjects<<SUBJECTS_EOF'
            sed 's#|#/#' "$RUNNER_TEMP/upload-list.txt"
            echo 'SUBJECTS_EOF'
          } >> "$GITHUB_OUTPUT"

      # The token is given to this step through env. (The attest step below reads the job's
      # token by default, in this same `contents: write` job.) A manual dispatch never reaches it.
      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Directory names were validated against the exact three; each file name against the
          # exact five. Change into each directory so gh is given bare, verified file names only.
          for d in installers-mac installers-linux installers-win; do
            mapfile -t files < <(sed -n "s#^artifacts/${d}|##p" "$RUNNER_TEMP/upload-list.txt")
            [ "${#files[@]}" -gt 0 ] || continue
            ( cd "artifacts/$d" && gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}" )
          done

      # Provenance for exactly the verified installers, after they are in the draft; a failure here
      # stops publish-release (it needs this job to succeed). Tag builds only: a branch build must not
      # pass `gh attestation verify`. `artifact-metadata: write` (storage record, tied to registry
      # pushes) is deliberately not granted; add it only if the first run shows it is needed.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.verify.outputs.subjects }}

      - name: Dispatch publishes nothing
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "Manual dispatch - checks passed, nothing uploaded to any release."

  # Flip the draft Release to published once the installers are in it.
  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && needs.upload.result == 'success'
    needs: [create-release, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_STABLE: ${{ needs.create-release.outputs.is_stable }}
        shell: bash
        run: |
          if [[ "$IS_STABLE" == "true" ]]; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --draft=false --prerelease=false --latest
          else
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --draft=false --prerelease=true
          fi

  # NOTE: the README download links are updated during RELEASE-PREP (a `version`
  # npm-lifecycle hook regenerates them into the same commit that bumps the version —
  # see docs/RELEASING.md), NOT by a post-release job pushing back to `main`. That
  # push required the github-actions bot to bypass the branch ruleset ("Changes must
  # be made through a pull request"), which it cannot — so the job only ever red-X'd.
